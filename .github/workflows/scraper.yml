name: Actualizador de Resultados

on:
  schedule:
    - cron: '*/15 * * * *'  # Se ejecuta cada 15 minutos automáticamente
  workflow_dispatch:        # Permite ejecutarlo manualmente desde la pestaña Actions

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install telethon pytz

      - name: Ejecutar script de resultados
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_STRING_SESSION: ${{ secrets.TELEGRAM_STRING_SESSION }}
        run: |
          python main.py

      - name: Guardar cambios si hay actualizaciones
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase || true
          git add resultados.json enviados.json || true
          git commit -m "Actualización automática de resultados [skip ci]" || exit 0
          git push
          
